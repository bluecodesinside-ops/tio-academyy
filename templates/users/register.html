{% extends 'base.html' %}
{% load static %}

{% block title %}Register{% endblock %}

{% block content %}
<div style="max-width: 400px; margin: 50px auto; padding: 20px;">
    <h2>Register</h2>
    
    {% if messages %}
        {% for message in messages %}
            <div style="padding: 10px; margin: 10px 0; background: {% if message.tags == 'error' %}#fee{% else %}#efe{% endif %}; border: 1px solid {% if message.tags == 'error' %}#c00{% else %}#0c0{% endif %};">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}
    
    <form method="post">
        {% csrf_token %}
        <div style="margin: 15px 0;">
            <label>Email:</label>
            <input type="email" name="email" required style="width: 100%; padding: 8px; margin-top: 5px;">
        </div>
        <div style="margin: 15px 0;">
            <label>Password:</label>
            <input type="password" name="password" required style="width: 100%; padding: 8px; margin-top: 5px;">
        </div>
        <div style="margin: 15px 0;">
            <label>Confirm Password:</label>
            <input type="password" name="password_confirm" required style="width: 100%; padding: 8px; margin-top: 5px;">
        </div>
        <button type="submit" style="width: 100%; padding: 10px; background: #007bff; color: white; border: none; cursor: pointer;">
            Register
        </button>
    </form>
    
    <p style="margin-top: 20px; text-align: center;">
        Already have an account? <a href="{% url 'users:login' %}">Login here</a>
    </p>
</div>
{% endblock %}
